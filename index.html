<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MP3 Player – Extreme Rubberband Version</title>
<style>
body { font-family: Arial; background:#111; color:white; padding:20px; }
label { display:block; margin-top:15px; }
input[type="range"] { width:400px; }
button { margin:5px; padding:8px 16px; }
#pitchValue { font-size:18px; margin-left:10px; }
</style>
</head>
<body>

<h2>MP3 Player – Extreme Pitch (10% – 400%)</h2>

<input type="file" id="fileInput" accept="audio/mp3">

<div>
  <button id="playPauseBtn">Play</button>

  <label>
    Pitch / Speed:
    <input type="range" id="pitchControl" min="0.1" max="4.0" step="0.01" value="1">
    <span id="pitchValue">1.00</span>
  </label>

  <label>
    Flanger:
    <input type="range" id="flangerControl" min="0" max="1" step="0.01" value="0">
  </label>

  <label>
    Reverb:
    <input type="range" id="reverbControl" min="0" max="1" step="0.01" value="0">
  </label>
</div>

<script src="js/rubberband-processor.js"></script>

<script>
let audioContext = new (window.AudioContext || window.webkitAudioContext)();
let audioBuffer = null;
let bufferSource = null;
let rubberbandProcessor = null;

let startTime = 0;
let pauseOffset = 0;
let isPlaying = false;

// EFFECTS
let dryGain = audioContext.createGain();
let flangerDelay = audioContext.createDelay();
let flangerFeedback = audioContext.createGain();
let flangerWet = audioContext.createGain();
let convolver = audioContext.createConvolver();
let reverbWet = audioContext.createGain();

dryGain.gain.value = 1;
flangerDelay.delayTime.value = 0.003;
flangerFeedback.gain.value = 0.7;
flangerWet.gain.value = 0;
reverbWet.gain.value = 0;

flangerDelay.connect(flangerFeedback);
flangerFeedback.connect(flangerDelay);

let lfo = audioContext.createOscillator();
let lfoGain = audioContext.createGain();
lfo.frequency.value = 0.3;
lfoGain.gain.value = 0.001;
lfo.connect(lfoGain);
lfoGain.connect(flangerDelay.delayTime);
lfo.start();

function createImpulseResponse(duration=2, decay=2.5){
  let rate = audioContext.sampleRate;
  let length = rate * duration;
  let impulse = audioContext.createBuffer(2, length, rate);
  for(let c=0;c<2;c++){
    let channel = impulse.getChannelData(c);
    for(let i=0;i<length;i++){
      channel[i] = (Math.random()*2-1) * Math.pow(1-i/length, decay);
    }
  }
  return impulse;
}
convolver.buffer = createImpulseResponse();

// FILE LOAD
document.getElementById("fileInput").addEventListener("change", function(e){
  let reader = new FileReader();
  reader.onload = function(ev){
    audioContext.decodeAudioData(ev.target.result).then(buffer=>{
      audioBuffer = buffer;
      pauseOffset = 0;
    });
  };
  reader.readAsArrayBuffer(e.target.files[0]);
});

function startPlayback(){
  if(!audioBuffer) return;

  if(typeof RubberbandProcessor !== 'undefined'){
    rubberbandProcessor = new RubberbandProcessor(audioContext, audioBuffer);
    rubberbandProcessor.setPitch(parseFloat(pitchControl.value));
    bufferSource = rubberbandProcessor.getSource();
  } else {
    bufferSource = audioContext.createBufferSource();
    bufferSource.buffer = audioBuffer;
    bufferSource.playbackRate.value = parseFloat(pitchControl.value);
  }

  bufferSource.connect(dryGain);
  dryGain.connect(audioContext.destination);

  bufferSource.connect(flangerDelay);
  flangerDelay.connect(flangerWet);
  flangerWet.connect(audioContext.destination);

  bufferSource.connect(convolver);
  convolver.connect(reverbWet);
  reverbWet.connect(audioContext.destination);

  startTime = audioContext.currentTime;
  bufferSource.start(0, pauseOffset);
}

function pausePlayback(){
  if(bufferSource){
    pauseOffset += audioContext.currentTime - startTime;
    bufferSource.stop();
    bufferSource.disconnect();
    bufferSource = null;
  }
}

const playPauseBtn = document.getElementById("playPauseBtn");
playPauseBtn.addEventListener("click", function(){
  if(!isPlaying){
    startPlayback();
    playPauseBtn.textContent = "Pause";
    isPlaying = true;
  } else {
    pausePlayback();
    playPauseBtn.textContent = "Play";
    isPlaying = false;
  }
});

// Pitch live ändern
const pitchControl = document.getElementById("pitchControl");
const pitchValue = document.getElementById("pitchValue");

pitchControl.addEventListener("input", function(e){
  let val = parseFloat(e.target.value);
  pitchValue.textContent = val.toFixed(2);

  if(isPlaying){
    if(rubberbandProcessor){
      rubberbandProcessor.setPitch(val);
    } else if(bufferSource){
      bufferSource.playbackRate.value = val;
    }
  }
});

// Mix
function updateMix(){
  let flanger = parseFloat(flangerControl.value);
  let reverb = parseFloat(reverbControl.value);
  flangerWet.gain.value = flanger;
  reverbWet.gain.value = reverb;
  dryGain.gain.value = 1 - Math.max(flanger, reverb);
}
flangerControl.addEventListener("input", updateMix);
reverbControl.addEventListener("input", updateMix);
</script>

</body>
</html>
