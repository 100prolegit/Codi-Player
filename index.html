<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MP3 Player – Pause/Resume an gleicher Stelle</title>
<style>
body { background:#111; color:white; font-family:Arial; padding:20px; }
button, label { margin-top:10px; display:block; }
input[type="range"] { width:300px; }
#pitchValue { width:50px; display:inline-block; text-align:center; margin-left:10px; }
#progressBar { width:100%; height:20px; background:#333; margin-top:10px; position:relative; cursor:pointer; }
#progress { height:100%; width:0%; background:#1db954; }
canvas { width:100%; height:100px; background:#222; margin-top:10px; }
</style>
</head>
<body>
<h2>MP3 Player – Pause/Resume an gleicher Stelle</h2>
<input type="file" id="fileInput" accept="audio/mp3">
<button id="playBtn">Play</button>
<button id="pauseBtn">Pause</button>
<button id="resetBtn">Reset</button>
<label> Pitch & Tempo Slider: <input type="range" id="pitchControl" min="0.5" max="2" step="0.01" value="1"> <span id="pitchValue">1.00</span> </label>
<label> Flanger (0–100%): <input type="range" id="flangerControl" min="0" max="1" step="0.01" value="0"> </label>
<label> Reverb (0–100%): <input type="range" id="reverbControl" min="0" max="1" step="0.01" value="0"> </label>
<div id="progressBar"><div id="progress"></div></div>
<canvas id="waveform"></canvas>
<script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();
let audioBuffer = null;
let bufferSource = null;
let pauseOffset = 0;      // Wie viele Sekunden vom Anfang des AudioBuffers
let isPlaying = false;
let animationFrameId;

// Effekte
let dryGain = ctx.createGain(); dryGain.gain.value = 1;
let flangerDelay = ctx.createDelay(); flangerDelay.delayTime.value = 0.003;
let flangerFeedback = ctx.createGain(); flangerFeedback.gain.value = 0.7;
flangerDelay.connect(flangerFeedback);
flangerFeedback.connect(flangerDelay);
let flangerWet = ctx.createGain(); flangerWet.gain.value = 0;
let lfo = ctx.createOscillator(); let lfoGain = ctx.createGain();
lfo.type = "sine"; lfo.frequency.value = 0.3;
lfoGain.gain.value = 0.001;
lfo.connect(lfoGain); lfoGain.connect(flangerDelay.delayTime);
lfo.start();
let convolver = ctx.createConvolver();
let reverbWet = ctx.createGain(); reverbWet.gain.value = 0;

function createImpulseResponse(duration=2.5, decay=3){
    let sampleRate = ctx.sampleRate, length = sampleRate*duration;
    let impulse = ctx.createBuffer(2,length,sampleRate);
    for(let c=0;c<2;c++){ let channel = impulse.getChannelData(c);
        for(let i=0;i<length;i++) channel[i] = (Math.random()*2-1)*Math.pow(1-i/length,decay);
    }
    return impulse;
}
convolver.buffer = createImpulseResponse();

// File Input
document.getElementById("fileInput").addEventListener("change", async e=>{
    const file = e.target.files[0]; if(!file) return;
    audioBuffer = await ctx.decodeAudioData(await file.arrayBuffer());
    pauseOffset = 0;
    drawWaveform();
    updateProgressBar();
});

function createSource(offset=0){
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = parseFloat(pitchSlider.value);
    
    // Connections
    source.connect(dryGain); dryGain.connect(ctx.destination);
    source.connect(flangerDelay); flangerDelay.connect(flangerWet); flangerWet.connect(ctx.destination);
    source.connect(convolver); convolver.connect(reverbWet); reverbWet.connect(ctx.destination);
    
    source.onended = () => {
        // Nur wenn wir noch spielen (nicht bei manuellem stop)
        if(isPlaying){
            isPlaying = false;
            pauseOffset = audioBuffer.duration; // Am Ende angekommen
            cancelAnimationFrame(animationFrameId);
            updateProgressBar();
        }
    };
    return source;
}

// Play / Resume - startet bei pauseOffset
function playAudio(){
    if(!audioBuffer || isPlaying) return;
    if(pauseOffset >= audioBuffer.duration) pauseOffset = 0; // Falls am Ende, von vorne
    
    bufferSource = createSource();
    bufferSource.start(0, pauseOffset); // Starte bei pauseOffset im Buffer
    isPlaying = true;
    updateProgressBar();
}

// Pause - stoppt und merkt sich die aktuelle Position
function pauseAudio(){
    if(!isPlaying) return;
    
    // WICHTIG: Erst Position berechnen, DANN stoppen!
    // Wir schätzen die aktuelle Position basierend auf der gespielten Zeit
    // Da der playbackRate sich ändern kann, ist das etwas komplexer
    
    // Einfache Lösung: Benutze ctx.currentTime direkt, aber wir müssen
    // den Offset im AudioBuffer berechnen
    
    // Alternative: Wir tracken die Zeit selbst im Animation Frame
    // Für jetzt: wir nutzen den aktuellen Fortschritt aus der Progress Bar
    
    // Stoppe den Sound
    if(bufferSource){
        bufferSource.onended = null; // Verhindere onended-Handler
        try { bufferSource.stop(); } catch(e) {}
    }
    
    isPlaying = false;
    cancelAnimationFrame(animationFrameId);
    
    // Berechne neue pauseOffset aus dem aktuellen Fortschritt
    // Wir aktualisieren ihn schon in updateProgressBar
}

// Reset
function resetAudio(){
    if(bufferSource){
        bufferSource.onended = null;
        try { bufferSource.stop(); } catch(e) {}
    }
    pauseOffset = 0;
    isPlaying = false;
    cancelAnimationFrame(animationFrameId);
    updateProgressBar();
}

// Pitch
const pitchSlider = document.getElementById("pitchControl");
const pitchValueSpan = document.getElementById("pitchValue");
pitchSlider.addEventListener("input", e=>{
    pitchValueSpan.textContent = parseFloat(e.target.value).toFixed(2);
    if(bufferSource) bufferSource.playbackRate.value = parseFloat(e.target.value);
});

// Mix
function updateMix(){
    flangerWet.gain.value = parseFloat(document.getElementById("flangerControl").value);
    reverbWet.gain.value = parseFloat(document.getElementById("reverbControl").value);
    dryGain.gain.value = 1-Math.max(flangerWet.gain.value,reverbWet.gain.value);
}
document.getElementById("flangerControl").addEventListener("input",updateMix);
document.getElementById("reverbControl").addEventListener("input",updateMix);

// Progress Bar
const progressDiv = document.getElementById("progress");
const progressBar = document.getElementById("progressBar");

// Startzeit für diese Wiedergabe-Session
let playStartTime = 0;

function updateProgressBar(){
    if(!audioBuffer) return;
    
    let current;
    if(isPlaying){
        // Zeit die seit diesem Play-Start vergangen ist, multipliziert mit playbackRate
        const elapsedAudioTime = (ctx.currentTime - playStartTime) * parseFloat(pitchSlider.value);
        current = pauseOffset + elapsedAudioTime;
        
        // Sicherheit: Nicht über das Ende hinaus
        if(current > audioBuffer.duration) current = audioBuffer.duration;
    } else {
        current = pauseOffset;
    }
    
    let percent = Math.min(100, (current / audioBuffer.duration) * 100);
    progressDiv.style.width = percent + "%";
    
    // Speichere für Pause
    if(isPlaying) {
        // Aktualisiere pauseOffset laufend, damit wir bei Pause exakt hier sind
        pauseOffset = current;
    }
    
    if(isPlaying) animationFrameId = requestAnimationFrame(updateProgressBar);
}

// Überschreibe playAudio mit korrekter playStartTime
const originalPlayAudio = playAudio;
playAudio = function(){
    if(!audioBuffer || isPlaying) return;
    if(pauseOffset >= audioBuffer.duration) pauseOffset = 0;
    
    // Merke wann wir gestartet haben
    playStartTime = ctx.currentTime;
    
    bufferSource = createSource();
    bufferSource.start(0, pauseOffset);
    isPlaying = true;
    updateProgressBar();
}

// Seek auf Progressbar
progressBar.addEventListener("click", (e)=>{
    if(!audioBuffer) return;
    const rect = progressBar.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    pauseOffset = percent * audioBuffer.duration;
    
    if(isPlaying){
        // Neu starten an neuer Position
        bufferSource.onended = null;
        try { bufferSource.stop(); } catch(e){}
        playStartTime = ctx.currentTime;
        bufferSource = createSource();
        bufferSource.start(0, pauseOffset);
    }
    updateProgressBar();
});

// Waveform
const canvas = document.getElementById("waveform");
const canvasCtx = canvas.getContext("2d");
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

function drawWaveform(){
    if(!audioBuffer) return;
    const width = canvas.width, height = canvas.height;
    const data = audioBuffer.getChannelData(0);
    canvasCtx.fillStyle = "#222"; canvasCtx.fillRect(0,0,width,height);
    canvasCtx.strokeStyle = "#1db954"; canvasCtx.beginPath();
    const step = Math.ceil(data.length / width);
    for(let i=0;i<width;i++){
        const min = Math.min(...data.slice(i*step,(i+1)*step));
        const max = Math.max(...data.slice(i*step,(i+1)*step));
        canvasCtx.moveTo(i, (1+min)*height/2);
        canvasCtx.lineTo(i, (1+max)*height/2);
    }
    canvasCtx.stroke();
}

// Buttons
document.getElementById("playBtn").addEventListener("click", playAudio);
document.getElementById("pauseBtn").addEventListener("click", pauseAudio);
document.getElementById("resetBtn").addEventListener("click", resetAudio);
</script>
</body>
</html>
