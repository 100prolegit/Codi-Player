<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Pitch‑Shifter Player mit SoundTouch Worklet</title>
<style>
  body { background:#111; color:white; font-family:Arial; padding:20px; }
  label, button { margin-top:10px; display:block; }
  #pitchControls { display:flex; gap:10px; margin-top:5px; }
  #pitchValue { width:40px; text-align:center; }
</style>
</head>
<body>

<h2>MP3 Player mit Echtzeit Pitch‑Shifter</h2>

<input type="file" id="fileInput" accept="audio/*">

<button id="playBtn">Play</button>
<button id="stopBtn">Stop</button>

<label>Pitch (Semitones)</label>
<div id="pitchControls">
  <button id="pitchDown">&lt;</button>
  <div id="pitchValue">0</div>
  <button id="pitchUp">&gt;</button>
</div>

<script>
(async ()=>{
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  // Lade SoundTouch Worklet
  await ctx.audioWorklet.addModule('js/soundtouch-worklet.js');

  let originalBuffer = null;
  let playerSource = null;

  let semitones = 0;
  const pitchDisplay = document.getElementById('pitchValue');

  // SoundTouch‑Node erstellen
  let soundTouchNode = new AudioWorkletNode(ctx, 'soundtouch-processor');

  document.getElementById('fileInput').addEventListener('change', async e => {
    let file = e.target.files[0];
    if (!file) return;
    let ab = await file.arrayBuffer();
    originalBuffer = await ctx.decodeAudioData(ab);
  });

  function connectAndPlay() {
    if (!originalBuffer) return;

    if (playerSource) {
      playerSource.disconnect();
    }
    playerSource = ctx.createBufferSource();
    playerSource.buffer = originalBuffer;

    // Pitch steuern
    soundTouchNode.parameters.get('pitchSemitones').value = semitones;

    // Chain: source → SoundTouchNode → destination
    playerSource.connect(soundTouchNode);
    soundTouchNode.connect(ctx.destination);

    playerSource.start();
  }

  document.getElementById('playBtn').onclick = connectAndPlay;
  document.getElementById('stopBtn').onclick = () => {
    if (playerSource) playerSource.stop();
  };

  document.getElementById('pitchUp').onclick = () => {
    if (semitones < 12) semitones++;
    pitchDisplay.textContent = semitones;
    soundTouchNode.parameters.get('pitchSemitones').value = semitones;
  };
  document.getElementById('pitchDown').onclick = () => {
    if (semitones > -12) semitones--;
    pitchDisplay.textContent = semitones;
    soundTouchNode.parameters.get('pitchSemitones').value = semitones;
  };
})();
</script>

</body>
</html>
