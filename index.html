<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PURPLE PLAYER</title>

<style>
:root{
  --purple:#7b2cff;
  --ink:#1d1d22;
  --uiBg:#ffffff;
  --vidBrightness: 1.17;
  --vidContrast: 1.00;
  --edge:#cfcfe2;
  --shadow: rgba(0,0,0,.18);

  /* ✅ RAW GitHub Assets */
  --sliderThumbImg: url("https://raw.githubusercontent.com/100prolegit/Codi-Player/main/Assets/fht.png");
  --thumbSize: 52px;
}

*{ box-sizing:border-box; }

html, body{ height:100%; }

body{
  margin:0;
  background: var(--uiBg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  display:flex;
  justify-content:center;

  /* ✅ Mobile soll Desktop-Look behalten:
     wenn Screen zu klein ist -> horizontal scroll statt Layout-Umbruch */
  overflow-x:auto;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior-x: none;
  touch-action: pan-x pan-y;
}

.plugin{
  width:min(900px,100vw);
  padding:10px;

  /* ✅ wenn sehr schmal: Plugin darf breiter sein als Viewport, damit Layout identisch bleibt */
  min-width: 900px;
}

/* PANEL */
.panel{
  border-radius:14px;
  background: var(--uiBg);
  border:1px solid var(--edge);
  box-shadow:0 10px 30px var(--shadow);
  padding:14px;
  position:relative;
  overflow:hidden;
}

/* Plugin Faceplate */
.panel::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:14px;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 1px rgba(123,44,255,.18),
    inset 0 0 0 3px rgba(0,0,0,.04),
    inset 0 14px 26px rgba(255,255,255,.55),
    inset 0 -18px 24px rgba(0,0,0,.06);
}
.panel::after{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:12px;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.06),
    inset 0 0 0 2px rgba(123,44,255,.08);
  opacity:.9;
}

.main{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:14px;
  align-items:start;
  position:relative;
  z-index:1;
}

.module{ border-radius:12px; padding:10px; }
.screen{ border-radius:10px; overflow:hidden; background:#000; }
.stage{ width:100%; position:relative; }

video{
  width:100%;
  height:auto;
  display:block;
  background:#000;
  object-fit:contain;
  filter: brightness(var(--vidBrightness)) contrast(var(--vidContrast));
}

.controls{
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:center;
}

.logo img{
  height:150px;
  user-select:none;
  -webkit-user-drag:none;
}

.controlPanel{ width:100%; padding:0; background:transparent; border:none; box-shadow:none; }

.triple{
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap:4px;
  align-items:start;
}

.ctrlCard{
  min-width:0;
  border-radius:12px;
  background: var(--uiBg);
  border:1px solid rgba(0,0,0,.06);
  box-shadow:
    0 10px 18px rgba(0,0,0,.10),
    0 2px 6px rgba(0,0,0,.06);
  padding:8px 4px;
}

.ctrl-label{
  text-align:center;
  font-size:11px;
  font-weight:900;
  letter-spacing:0.16em;
  color:var(--purple);
  margin-bottom:6px;
}

/* Slider Area */
.slider-wrap{
  height:240px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* Range: Track */
.vslider{
  -webkit-appearance:none;
  appearance:none;
  width:152px;
  height:9px;
  border-radius:999px;
  transform:rotate(-90deg);
  background:linear-gradient(to right,var(--purple) 0%,var(--purple) 0%,#ddd 0%,#ddd 100%);
  outline:none;
  touch-action: none; /* ✅ wichtig auf mobile */
}

/* Thumb: PNG */
.vslider::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width: var(--thumbSize);
  height: var(--thumbSize);
  border-radius:0;
  border:none;
  background-color:transparent;
  background-image: var(--sliderThumbImg);
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
  transform: rotate(90deg);
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.20));
  cursor:pointer;
}
.vslider::-webkit-slider-thumb:active{
  filter: drop-shadow(0 3px 7px rgba(0,0,0,.24));
}

/* Firefox */
.vslider::-moz-range-thumb{
  width: var(--thumbSize);
  height: var(--thumbSize);
  border-radius:0;
  border:none;
  background-color:transparent;
  background-image: var(--sliderThumbImg);
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
  transform: rotate(90deg);
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.20));
  cursor:pointer;
}
.vslider::-moz-range-track{
  height:9px;
  border-radius:999px;
  background:transparent;
}

.slider-tooltip{
  position:absolute;
  padding:5px 8px;
  font-size:11px;
  font-weight:800;
  background:var(--purple);
  color:#fff;
  border-radius:6px;
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-8px);
  transition:opacity .12s ease;
  white-space:nowrap;
  will-change: transform, top, left;
}

/* Knob */
.knobWrap{
  height:240px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}
.knob{
  width:74px;
  height:74px;
  border-radius:50%;
  position:relative;
  user-select:none;
  touch-action:none;
  cursor:grab;
  box-shadow:0 10px 18px rgba(0,0,0,.10);
  display:grid;
  place-items:center;
  overflow:hidden;
}
.knob:active{ cursor:grabbing; }

.knobImg{
  width:100%;
  height:100%;
  object-fit:contain;
  transform: rotate(var(--a, 0deg));
  transform-origin: 50% 50%;
  will-change: transform;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}
.knob::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%);
  pointer-events:none;
}
.knobTip{
  position:absolute;
  top:32px;
  left:50%;
  transform:translate(-50%,-120%);
  padding:5px 8px;
  font-size:11px;
  font-weight:800;
  background:var(--purple);
  color:#fff;
  border-radius:6px;
  pointer-events:none;
  opacity:0;
  transition:opacity .12s ease;
  white-space:nowrap;
}

/* Screws */
.screws{ position:absolute; inset:0; pointer-events:none; z-index:2; }
.screw{
  position:absolute;
  width:16px; height:16px; border-radius:50%;
  background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f0f0f6 28%, #cfcfe0 62%, #a8a8bf 100%);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.18),
    0 2px 6px rgba(0,0,0,.18);
  opacity:.95;
}
.screw::before{
  content:"";
  position:absolute;
  left:50%; top:50%;
  width:10px; height:2px;
  border-radius:2px;
  transform:translate(-50%,-50%) rotate(var(--r, 22deg));
  background: linear-gradient(to right, rgba(0,0,0,.15), rgba(0,0,0,.55), rgba(0,0,0,.15));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}
.screw::after{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:50%;
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.10),
    inset 0 0 0 2px rgba(123,44,255,.06);
}

/* Bottom Row */
.bottomRow{
  margin-top:12px;
  display:grid;
  grid-template-columns: 280px 1fr;
  gap:12px;
  position:relative;
  z-index:1;
}

/* Player */
.playerPanel{
  border-radius:12px;
  background: var(--uiBg);
  border:1px solid rgba(0,0,0,.08);
  box-shadow:
    0 10px 18px rgba(0,0,0,.10),
    0 2px 6px rgba(0,0,0,.06);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:160px;
}

.playerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.playerTitle{
  font-size:11px;
  font-weight:900;
  letter-spacing:0.16em;
  color:var(--purple);
}
.smallBtn{
  appearance:none;
  border:1px solid rgba(0,0,0,.10);
  background:#fff;
  color:var(--ink);
  border-radius:10px;
  padding:8px 10px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 6px 12px rgba(0,0,0,.08);
}
.smallBtn:active{ transform: translateY(1px); }
.smallBtn.purple{
  border-color: rgba(123,44,255,.35);
  box-shadow:0 8px 14px rgba(123,44,255,.18), 0 2px 6px rgba(0,0,0,.06);
}

.nowPlaying{
  font-weight:900;
  color:var(--ink);
  font-size:13px;
  line-height:1.2;
  min-height: 2.4em;
}
.nowPlaying span{
  display:block;
  font-weight:800;
  color:#4b4b59;
  font-size:12px;
  opacity:.9;
}

.playerControls{
  display:flex;
  gap:8px;
  align-items:center;
}
.iconBtn{
  width:42px;
  height:42px;
  border-radius:12px;
  border:1px solid rgba(0,0,0,.10);
  background:#fff;
  cursor:pointer;
  font-weight:900;
  display:grid;
  place-items:center;
  box-shadow:0 6px 12px rgba(0,0,0,.08);
}
.iconBtn:active{ transform: translateY(1px); }
.iconBtn.play{ border-color: rgba(123,44,255,.35); }

.playerVol{
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
  padding-left:4px;
}
.playerVol label{
  font-size:11px;
  font-weight:900;
  letter-spacing:0.12em;
  color:var(--purple);
}
.hslider{
  width:100%;
  -webkit-appearance:none;
  appearance:none;
  height:9px;
  border-radius:999px;
  outline:none;
  background:linear-gradient(to right,var(--purple) 60%, #ddd 60%);
}
.hslider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:#fff;border:3px solid var(--purple);
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.hslider::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:#fff;border:3px solid var(--purple);
}

.playlist{
  border:1px solid rgba(0,0,0,.08);
  border-radius:10px;
  overflow:hidden;
  background: rgba(0,0,0,.015);
}
.playlistHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 10px;
  border-bottom:1px solid rgba(0,0,0,.06);
  font-size:12px;
  font-weight:900;
  color:#4b4b59;
}
.playlistList{
  max-height:170px;
  overflow:auto;
}
.track{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 10px;
  cursor:pointer;
  border-bottom:1px solid rgba(0,0,0,.05);
}
.track:last-child{ border-bottom:none; }
.track:hover{ background: rgba(123,44,255,.06); }
.track.active{ background: rgba(123,44,255,.10); }
.trackName{
  font-size:12px;
  font-weight:900;
  color:var(--ink);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.trackMeta{
  font-size:11px;
  font-weight:900;
  color:#4b4b59;
  opacity:.9;
}
.trackX{
  border:none;
  background:transparent;
  font-weight:900;
  cursor:pointer;
  padding:6px 8px;
  border-radius:8px;
}
.trackX:hover{ background: rgba(0,0,0,.05); }

.hiddenInput{ display:none; }

/* Waveform */
.wavePanel{
  border-radius:12px;
  background: var(--uiBg);
  border:1px solid rgba(0,0,0,.08);
  box-shadow:
    0 10px 18px rgba(0,0,0,.10),
    0 2px 6px rgba(0,0,0,.06);
  padding:10px;
  position:relative;
}
.waveTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}
.waveTitle{
  font-size:11px;
  font-weight:900;
  letter-spacing:0.16em;
  color:var(--purple);
}
.waveMeta{
  font-size:12px;
  color:#4b4b59;
  font-weight:700;
  opacity:.9;
}
#waveCanvas{
  width:100%;
  height:300px;
  display:block;
  border-radius:10px;
  background: linear-gradient(180deg, rgba(123,44,255,.06), rgba(0,0,0,.02));
  border:1px solid rgba(0,0,0,.06);
}
.waveHint{
  margin-top:6px;
  font-size:11px;
  color:#4b4b59;
  font-weight:800;
  opacity:.9;
}

/* ✅ Powered by */
.poweredBy{
  position:absolute;
  right:16px;
  bottom:14px;
  z-index:3;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 8px;
  border-radius:10px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(0,0,0,.06);
  box-shadow:0 8px 16px rgba(0,0,0,.10);
  backdrop-filter: blur(6px);
}
.poweredBy span{
  font-size:10px;
  font-weight:900;
  letter-spacing:0.14em;
  color:#4b4b59;
  text-transform:uppercase;
  white-space:nowrap;
}
.poweredBy img{
  height:18px;
  width:auto;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

/* ✅ WICHTIG: responsive Umbrüche bewusst deaktiviert.
   (Du kannst das komplett weglassen — ist hier nur als "Override" falls irgendwo was reinrutscht) */
@media (max-width:760px){
  .main{ grid-template-columns:330px 1fr !important; }
  .triple{ grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
  .bottomRow{ grid-template-columns: 280px 1fr !important; }
  .knobWrap{ height:240px !important; padding:0 !important; }
  .poweredBy{ right:16px !important; bottom:14px !important; }
}
</style>
</head>

<body>
<div class="plugin">
  <div class="panel">

    <div class="poweredBy" aria-label="Powered by Onyos">
      <span>POWERED BY</span>
      <img src="https://raw.githubusercontent.com/100prolegit/Codi-Player/main/Assets/onyos.png" alt="Onyos">
    </div>

    <div class="screws" aria-hidden="true">
      <div class="screw" style="left:10px; top:10px; --r:18deg;"></div>
      <div class="screw" style="right:10px; top:10px; --r:-12deg;"></div>
      <div class="screw" style="left:10px; bottom:10px; --r:33deg;"></div>
      <div class="screw" style="right:10px; bottom:10px; --r:-28deg;"></div>

      <div class="screw" style="left:18%; top:10px; --r:8deg;"></div>
      <div class="screw" style="left:34%; top:10px; --r:-6deg;"></div>
      <div class="screw" style="left:50%; top:10px; --r:14deg;"></div>
      <div class="screw" style="left:66%; top:10px; --r:-10deg;"></div>
      <div class="screw" style="left:82%; top:10px; --r:6deg;"></div>

      <div class="screw" style="left:18%; bottom:10px; --r:-9deg;"></div>
      <div class="screw" style="left:34%; bottom:10px; --r:12deg;"></div>
      <div class="screw" style="left:50%; bottom:10px; --r:-14deg;"></div>
      <div class="screw" style="left:66%; bottom:10px; --r:10deg;"></div>
      <div class="screw" style="left:82%; bottom:10px; --r:-6deg;"></div>

      <div class="screw" style="left:10px; top:22%; --r:-8deg;"></div>
      <div class="screw" style="left:10px; top:38%; --r:16deg;"></div>
      <div class="screw" style="left:10px; top:54%; --r:-18deg;"></div>
      <div class="screw" style="left:10px; top:70%; --r:10deg;"></div>

      <div class="screw" style="right:10px; top:22%; --r:12deg;"></div>
      <div class="screw" style="right:10px; top:38%; --r:-16deg;"></div>
      <div class="screw" style="right:10px; top:54%; --r:18deg;"></div>
      <div class="screw" style="right:10px; top:70%; --r:-10deg;"></div>
    </div>

    <div class="main">

      <div class="module">
        <div class="screen">
          <div class="stage">
            <video id="video"
              src="https://raw.githubusercontent.com/100prolegit/Codi-Player/main/Assets/video.mp4"
              playsinline muted preload="metadata">

          </div>

      <div class="controls">
        <div class="logo">

        <div class="controlPanel">

                <input type="range" class="vslider" id="sliderLean" min="0" max="648" value="648" step="1">
                <div class="slider-tooltip" id="tipLean">100%</div>
              </div>
            </div>

            <div class="ctrlCard">
              <div class="ctrl-label">REVERB</div>
              <div class="knobWrap">
                <div class="knobTip" id="tipReverb">0.0%</div>
                <input type="range" id="reverb" min="0" max="1" value="0.0" step="0.001"
                  style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;">
                <div class="knob" id="reverb_ui" style="--a:-135deg" role="slider"
                  aria-label="Reverb" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" tabindex="0">
                  <img class="knobImg" src="https://raw.githubusercontent.com/100prolegit/Codi-Player/main/Assets/knob.png" alt="">
                </div>
              </div>
            </div>

            <div class="ctrlCard">
              <div class="ctrl-label">FLANGER</div>
              <div class="slider-wrap" id="wrapFlanger">
                <input type="range" class="vslider" id="sliderFlanger" min="0" max="1000" value="0" step="1">
                <div class="slider-tooltip" id="tipFlanger">0%</div>

        <div class="playerControls">
          <button class="iconBtn" id="btnPrev" title="Previous">⟨⟨</button>
          <button class="iconBtn play" id="btnPlay" title="Play/Pause">▶</button>

          <div class="playerVol">
            <label>VOL</label>
            <input id="vol" class="hslider" type="range" min="0" max="1" value="0.85" step="0.001">
          </div>
        </div>

        <div class="playlist">
          <div class="playlistHeader">
            <div>PLAYLIST</div>
            <button class="smallBtn" id="btnClear" title="Clear playlist">Clear</button>
          </div>
          <div class="playlistList" id="playlist"></div>
        </div>
      </div>

      <div class="wavePanel">
        <div class="waveTop">
          <div class="waveTitle">WAVEFORM</div>
          <div class="waveMeta" id="waveMeta">Füge einen Track hinzu…</div>
        </div>
        <canvas id="waveCanvas" aria-label="Waveform"></canvas>
        <div class="waveHint">Tipp: Klicke in die Waveform um im Track zu springen.</div>
      </div>

    </div>

  </div>
</div>

<script src="https://raw.githubusercontent.com/100prolegit/Codi-Player/main/js/rubberband-processor.js"></script>

<script>
/* =========================================================
   0) Video + LEAN Scrub
========================================================= */
const video = document.getElementById("video");
let videoDuration = 0;

video.addEventListener("loadedmetadata", () => {
  videoDuration = video.duration || 0;
});

function scrubVideoTo(p01){
  if(!videoDuration) return;
  const p = Math.max(0, Math.min(1, p01));
  const maxFillPoint = 0.648;
  const t = p * videoDuration * maxFillPoint;

  const now = performance.now() / 1000;
  const FPS = 30;
  const MIN_DT = 1 / FPS;
  if(now - (window.__lastVideoSet || 0) < MIN_DT) return;

  if(Math.abs((window.__lastVideoTime||0) - t) > 0.004){
    video.currentTime = t;
    window.__lastVideoTime = t;
  }
  window.__lastVideoSet = now;
}

/* =========================================================
   1) WEBAUDIO ENGINE
========================================================= */
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

const AC = window.AudioContext || window.webkitAudioContext;
const audioContext = new AC();

let audioBuffer = null;
let sourceNode = null;
let rubberband = null;

let startTime = 0;
let pauseOffset = 0;
let isPlaying = false;

/* Master */
const masterGain = audioContext.createGain();
masterGain.gain.value = 0.85;
masterGain.connect(audioContext.destination);

/* Dry */
const dryGain = audioContext.createGain();
dryGain.gain.value = 1.0;
dryGain.connect(masterGain);

/* Flanger */
const flangerDelay = audioContext.createDelay();
flangerDelay.delayTime.value = 0.003;

const flangerFeedback = audioContext.createGain();
flangerFeedback.gain.value = 0.7;

const flangerWet = audioContext.createGain();
flangerWet.gain.value = 0.0;
flangerWet.connect(masterGain);

flangerDelay.connect(flangerFeedback);
flangerFeedback.connect(flangerDelay);

/* LFO */
const lfo = audioContext.createOscillator();
const lfoGain = audioContext.createGain();
lfo.frequency.value = 0.3;
lfoGain.gain.value = 0.001;
lfo.connect(lfoGain);
lfoGain.connect(flangerDelay.delayTime);
lfo.start();

/* Reverb */
const convolver = audioContext.createConvolver();
const reverbWet = audioContext.createGain();
reverbWet.gain.value = 0.0;
reverbWet.connect(masterGain);

function createImpulseResponse(duration=2, decay=2.5){
  const rate = audioContext.sampleRate;
  const length = Math.floor(rate * duration);
  const impulse = audioContext.createBuffer(2, length, rate);
  for(let c=0;c<2;c++){
    const channel = impulse.getChannelData(c);
    for(let i=0;i<length;i++){
      channel[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay);
    }
  }
  return impulse;
}
convolver.buffer = createImpulseResponse();

function stopSource(){
  if(!sourceNode) return;
  try{ sourceNode.onended = null; }catch{}
  try{ sourceNode.stop(); }catch{}
  try{ sourceNode.disconnect(); }catch{}
  sourceNode = null;
  rubberband = null;
}

function routeSource(node){
  node.connect(dryGain);
  node.connect(flangerDelay);
  flangerDelay.connect(flangerWet);
  node.connect(convolver);
  convolver.connect(reverbWet);
}

/* Pitch */
function pToPitch(p01){
  const p = clamp01(p01);
  return 0.55 + 0.45 * p;
}
let currentPitch = 1.0;

function setPitchLive(pitch){
  const v = clamp(pitch, 0.55, 1.0);
  currentPitch = v;

  if(rubberband && typeof rubberband.setPitch === "function"){
    rubberband.setPitch(v);
    return;
  }
  if(sourceNode && sourceNode.playbackRate){
    sourceNode.playbackRate.value = v;
  }
}

async function ensureAudio(){
  if(audioContext.state === "suspended"){
    try{ await audioContext.resume(); }catch{}
  }
}

function getCurrentTime(){
  if(!audioBuffer) return 0;
  if(isPlaying){
    return clamp(audioContext.currentTime - startTime + pauseOffset, 0, audioBuffer.duration);
  }
  return clamp(pauseOffset, 0, audioBuffer.duration);
}

function startPlayback(){
  if(!audioBuffer) return;

  stopSource();

  if(typeof RubberbandProcessor !== "undefined"){
    rubberband = new RubberbandProcessor(audioContext, audioBuffer);
    if(typeof rubberband.setPitch === "function") rubberband.setPitch(currentPitch);
    sourceNode = (typeof rubberband.getSource === "function") ? rubberband.getSource() : null;
  }

  if(!sourceNode){
    rubberband = null;
    sourceNode = audioContext.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.playbackRate.value = currentPitch;
  }

  routeSource(sourceNode);

  startTime = audioContext.currentTime;
  sourceNode.start(0, pauseOffset);
  isPlaying = true;

  sourceNode.onended = () => {
    if(isPlaying){
      isPlaying = false;
      pauseOffset = 0;
      btnPlay.textContent = "▶";
      if(tracks.length){
        const next = (current + 1) % tracks.length;
        loadTrack(next, true);
      }
    }
  };
}

function pausePlayback(){
  if(!isPlaying) return;
  pauseOffset = getCurrentTime();
  stopSource();
  isPlaying = false;
}

function seekTo(seconds){
  if(!audioBuffer) return;
  pauseOffset = clamp(seconds, 0, audioBuffer.duration);
  if(isPlaying) startPlayback();
}

/* FX mix */
function setFlangerMix(v01){ flangerWet.gain.value = clamp01(v01); }
function setReverbMix(v01){ reverbWet.gain.value = clamp01(v01); }
function setMasterVol(v01){ masterGain.gain.value = clamp01(v01); }

/* =========================================================
   2) Smooth Vertical Slider
========================================================= */
function createSmoothVSlider({ sliderEl, tooltipEl, wrapEl, maxValue, uiSmooth = 0.22, onValue }){
  let targetP = Number(sliderEl.value) / maxValue;
  let uiP = targetP;

  let wrapRect = null;
  let sliderRect = null;

  function measure(){
    wrapRect = wrapEl.getBoundingClientRect();
    sliderRect = sliderEl.getBoundingClientRect();
  }
  window.addEventListener("resize", measure, { passive:true });

  function updateGradient(p){
    const p100 = p * 100;
    sliderEl.style.background = `linear-gradient(to right,
      var(--purple) 0%,
      var(--purple) ${p100}%,
      #ddd ${p100}%,
      #ddd 100%)`;
  }

  function updateTooltip(p){
    tooltipEl.textContent = (p * 100).toFixed(1) + "%";
    if (!wrapRect || !sliderRect) return;

    const y = (1 - p) * sliderRect.height;
    const left = (sliderRect.left - wrapRect.left) + (sliderRect.width / 2);
    const top  = (sliderRect.top  - wrapRect.top) + y;

    tooltipEl.style.left = left + "px";
    tooltipEl.style.top  = top + "px";
  }

  function showTip(){ measure(); tooltipEl.style.opacity = 1; }
  function hideTip(){ tooltipEl.style.opacity = 0; }

  sliderEl.addEventListener("mouseenter", showTip);
  sliderEl.addEventListener("mouseleave", hideTip);
  sliderEl.addEventListener("pointerdown", showTip);
  sliderEl.addEventListener("pointerup", hideTip);
  sliderEl.addEventListener("pointercancel", hideTip);

  sliderEl.addEventListener("input", () => {
    targetP = clamp01(Number(sliderEl.value) / maxValue);
  }, { passive:true });

  function tick(nowMs){
    uiP += (targetP - uiP) * uiSmooth;
    updateGradient(uiP);
    updateTooltip(uiP);
    if (onValue) onValue(uiP, nowMs/1000);
    requestAnimationFrame(tick);
  }

  measure();
  requestAnimationFrame(tick);
}

/* ✅ LEAN: Pitch + MP4 scrub */
createSmoothVSlider({
  sliderEl: document.getElementById("sliderLean"),
  tooltipEl: document.getElementById("tipLean"),
  wrapEl: document.getElementById("wrapLean"),
  maxValue: 648,
  uiSmooth: 0.22,
  onValue: (p) => {
    setPitchLive(pToPitch(p));
    scrubVideoTo(p);
  }
});

/* FLANGER */
createSmoothVSlider({
  sliderEl: document.getElementById("sliderFlanger"),
  tooltipEl: document.getElementById("tipFlanger"),
  wrapEl: document.getElementById("wrapFlanger"),
  maxValue: 1000,
  uiSmooth: 0.22,
  onValue: (p) => setFlangerMix(p)
});

/* REVERB knob */
(function initReverbKnob(){
  const input = document.getElementById("reverb");
  const ui = document.getElementById("reverb_ui");
  const tip = document.getElementById("tipReverb");

  let target = Number(input.value);
  let val = target;
  const SMOOTH = 0.25;

  function setAngle(v01){
    const a = -135 + (270 * clamp01(v01));
    ui.style.setProperty("--a", `${a}deg`);
    ui.setAttribute("aria-valuenow", String(v01));
    tip.textContent = (v01 * 100).toFixed(1) + "%";
  }
  function showTip(){ tip.style.opacity = 1; }
  function hideTip(){ tip.style.opacity = 0; }

  setAngle(val);
  setReverbMix(val);

  let dragging = false;
  let startY = 0;
  let startVal = 0;

  ui.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    dragging = true;
    startY = e.clientY;
    startVal = target;
    ui.setPointerCapture(e.pointerId);
    showTip();
    e.preventDefault();
  });

  ui.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dy = startY - e.clientY;
    target = clamp01(startVal + dy / 180);
    input.value = String(target);
  });

  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    try { ui.releasePointerCapture(e.pointerId); } catch {}
    hideTip();
  };

  ui.addEventListener("pointerup", end);
  ui.addEventListener("pointercancel", end);

  ui.addEventListener("mouseenter", showTip);
  ui.addEventListener("mouseleave", () => { if (!dragging) hideTip(); });

  ui.addEventListener("keydown", (e) => {
    const step = 0.02;
    if (!["ArrowLeft","ArrowDown","ArrowRight","ArrowUp"].includes(e.key)) return;
    let v = target;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") v = clamp01(v - step);
    if (e.key === "ArrowRight" || e.key === "ArrowUp") v = clamp01(v + step);
    target = v;
    input.value = String(target);
    showTip();
    clearTimeout(ui._tipT);
    ui._tipT = setTimeout(() => { if (!dragging) hideTip(); }, 600);
  });

  function tick(){
    val += (target - val) * SMOOTH;
    setAngle(val);
    setReverbMix(val);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* =========================================================
   3) Player / Playlist
========================================================= */
const filePick = document.getElementById("filePick");
const btnAdd = document.getElementById("btnAdd");
const btnPlay = document.getElementById("btnPlay");
const btnPrev = document.getElementById("btnPrev");
const btnNext = document.getElementById("btnNext");
const btnClear = document.getElementById("btnClear");
const vol = document.getElementById("vol");
const playlistEl = document.getElementById("playlist");
const nowPlayingEl = document.getElementById("nowPlaying");

let tracks = [];
let current = -1;

function setVolUI(v){
  const p = clamp01(v);
  vol.value = String(p);
  vol.style.background = `linear-gradient(to right,var(--purple) ${p*100}%, #ddd ${p*100}%)`;
  setMasterVol(p);
}
setVolUI(0.85);
vol.addEventListener("input", () => setVolUI(Number(vol.value)), { passive:true });

btnAdd.addEventListener("click", () => filePick.click());

filePick.addEventListener("change", (e) => {
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  for(const f of files){
    const url = URL.createObjectURL(f);
    tracks.push({ name: f.name, url, file: f, dur: null });
  }
  renderPlaylist();
  if(current === -1) loadTrack(0, false);
  filePick.value = "";
});

btnPlay.addEventListener("click", async () => {
  await ensureAudio();
  try{ video.pause(); }catch{}

  if(current === -1 && tracks.length) await loadTrack(0, false);
  if(!audioBuffer) return;

  if(!isPlaying){
    startPlayback();
    btnPlay.textContent = "❚❚";
  }else{
    pausePlayback();
    btnPlay.textContent = "▶";
  }
});

btnPrev.addEventListener("click", async () => {
  if(!tracks.length) return;
  await ensureAudio();
  const i = current <= 0 ? tracks.length - 1 : current - 1;
  await loadTrack(i, true);
});
btnNext.addEventListener("click", async () => {
  if(!tracks.length) return;
  await ensureAudio();
  const i = (current + 1) % tracks.length;
  await loadTrack(i, true);
});

btnClear.addEventListener("click", () => {
  stopSource();
  isPlaying = false;
  audioBuffer = null;
  pauseOffset = 0;
  btnPlay.textContent = "▶";

  for(const t of tracks){ try{ URL.revokeObjectURL(t.url); }catch{} }
  tracks = [];
  current = -1;

  nowPlayingEl.innerHTML = `<div>Keine Tracks geladen</div><span>Füge MP3/WAV/etc. hinzu</span>`;
  renderPlaylist();
  buildWaveformFromFile(null);
});

function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) return "--:--";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2,"0")}`;
}

function updateNowPlaying(){
  if(current < 0 || !tracks[current]){
    nowPlayingEl.innerHTML = `<div>Keine Tracks geladen</div><span>Füge MP3/WAV/etc. hinzu</span>`;
    return;
  }
  const dur = audioBuffer ? audioBuffer.duration : (tracks[current].dur || 0);
  nowPlayingEl.innerHTML = `<div>${tracks[current].name}</div><span>${fmtTime(getCurrentTime())} / ${fmtTime(dur)}</span>`;
}

function renderPlaylist(){
  playlistEl.innerHTML = "";
  if(!tracks.length){
    const empty = document.createElement("div");
    empty.style.padding = "10px";
    empty.style.fontWeight = "900";
    empty.style.color = "#4b4b59";
    empty.style.opacity = "0.9";
    empty.textContent = "Playlist leer";
    playlistEl.appendChild(empty);
    return;
  }

  tracks.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "track" + (i === current ? " active" : "");
    row.title = "Click to play";

    const left = document.createElement("div");
    left.style.minWidth = "0";

    const name = document.createElement("div");
    name.className = "trackName";
    name.textContent = t.name;

    const meta = document.createElement("div");
    meta.className = "trackMeta";
    meta.textContent = t.dur ? fmtTime(t.dur) : "--:--";

    left.appendChild(name);
    left.appendChild(meta);

    const right = document.createElement("div");
    right.style.display = "flex";
    right.style.alignItems = "center";
    right.style.gap = "6px";

    const del = document.createElement("button");
    del.className = "trackX";
    del.textContent = "✕";
    del.title = "Remove";
    del.addEventListener("click", (ev) => {
      ev.stopPropagation();
      removeTrack(i);
    });

    right.appendChild(del);

    row.appendChild(left);
    row.appendChild(right);

    row.addEventListener("click", async () => {
      await ensureAudio();
      await loadTrack(i, true);
    });

    playlistEl.appendChild(row);
  });
}

async function loadTrack(index, autoplay=false){
  if(index < 0 || index >= tracks.length) return;

  stopSource();
  isPlaying = false;
  pauseOffset = 0;

  current = index;
  renderPlaylist();

  const file = tracks[current].file;

  try{
    await ensureAudio();
    const arr = await file.arrayBuffer();
    const buf = await audioContext.decodeAudioData(arr.slice(0));
    audioBuffer = buf;
    tracks[current].dur = buf.duration;

    await buildWaveformFromFile(file);
    waveMeta.textContent = `Track • ${buf.numberOfChannels}ch • ${buf.sampleRate} Hz • ${buf.duration.toFixed(2)}s`;
    updateNowPlaying();

    if(autoplay){
      startPlayback();
      btnPlay.textContent = "❚❚";
    }else{
      btnPlay.textContent = "▶";
    }
  }catch(err){
    audioBuffer = null;
    waveMeta.textContent = "Track konnte nicht geladen werden (Codec/Browser).";
    btnPlay.textContent = "▶";
  }
}

function removeTrack(index){
  if(index < 0 || index >= tracks.length) return;

  const wasCurrent = (index === current);
  const removed = tracks.splice(index, 1)[0];
  try{ URL.revokeObjectURL(removed.url); }catch{}

  if(!tracks.length){
    stopSource();
    isPlaying = false;
    audioBuffer = null;
    pauseOffset = 0;
    current = -1;
    btnPlay.textContent = "▶";
    buildWaveformFromFile(null);
    updateNowPlaying();
  }else{
    if(wasCurrent){
      const next = Math.min(index, tracks.length - 1);
      loadTrack(next, true);
    }else if(index < current){
      current -= 1;
      renderPlaylist();
      updateNowPlaying();
    }else{
      renderPlaylist();
      updateNowPlaying();
    }
  }
}

/* =========================================================
   4) Waveform
========================================================= */
const waveCanvas = document.getElementById("waveCanvas");
const waveMeta = document.getElementById("waveMeta");
const wctx = waveCanvas.getContext("2d");

let __waveAmps = null;
let __waveBars = 2000;
let __waveWin = 420;
let __waveSmooth = 0.65;

function fitCanvasToCSS(canvas){
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  return { dpr };
}

function drawWaveWindow(amps, centerProgress01){
  if(!amps) return;
  const { dpr } = fitCanvasToCSS(waveCanvas);
  const W = waveCanvas.width, H = waveCanvas.height;

  wctx.setTransform(1,0,0,1,0,0);
  wctx.clearRect(0,0,W,H);

  wctx.fillStyle = "rgba(123,44,255,0.04)";
  wctx.fillRect(0,0,W,H);

  const mid = H/2;
  const pad = 12 * dpr;
  const usableH = H - pad*2;

  const n = amps.length;
  const win = Math.max(80, Math.min(__waveWin, n));
  const centerIdx = Math.floor(clamp01(centerProgress01) * (n - 1));
  const start = Math.max(0, Math.min(n - win, centerIdx - Math.floor(win/2)));

  const sm = __waveSmooth;

  wctx.strokeStyle = "rgba(123,44,255,0.95)";
  wctx.lineWidth = Math.max(1, 1.2 * dpr);
  wctx.lineCap = "round";

  const stepX = (W - pad*2) / win;

  wctx.beginPath();
  let prev = amps[start] || 0;
  for(let i=0;i<win;i++){
    const idx = start + i;
    const x = pad + i * stepX;
    const a0 = amps[idx] || 0;
    const a = prev * sm + a0 * (1 - sm);
    prev = a;

    const y1 = mid - (a * usableH/2);
    const y2 = mid + (a * usableH/2);
    wctx.moveTo(x, y1);
    wctx.lineTo(x, y2);
  }
  wctx.stroke();

  wctx.strokeStyle = "rgba(0,0,0,0.10)";
  wctx.lineWidth = Math.max(1, 1 * dpr);
  wctx.beginPath();
  wctx.moveTo(pad, mid);
  wctx.lineTo(W - pad, mid);
  wctx.stroke();

  const x = pad + (W - pad*2) * 0.5;
  wctx.strokeStyle = "rgba(29,29,34,0.65)";
  wctx.lineWidth = Math.max(1, 1.4 * dpr);
  wctx.beginPath();
  wctx.moveTo(x, 10*dpr);
  wctx.lineTo(x, H - 10*dpr);
  wctx.stroke();
}

async function buildWaveformFromFile(file){
  try{
    if(!file){
      __waveAmps = null;
      waveMeta.textContent = "Füge einen Track hinzu…";
      return;
    }

    waveMeta.textContent = "Waveform wird analysiert…";
    const arr = await file.arrayBuffer();
    const buf = await audioContext.decodeAudioData(arr.slice(0));

    const ch0 = buf.getChannelData(0);
    const ch1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;

    const bars = __waveBars;
    const block = Math.floor(ch0.length / bars) || 1;
    const amps = new Float32Array(bars);

    for(let i=0;i<bars;i++){
      const start = i * block;
      let peak = 0;
      for(let j=0;j<block;j++){
        const idx = start + j;
        if(idx >= ch0.length) break;
        const v0 = Math.abs(ch0[idx]);
        const v = ch1 ? (v0 + Math.abs(ch1[idx])) * 0.5 : v0;
        if(v > peak) peak = v;
      }
      amps[i] = peak;
    }

    for(let i=0;i<amps.length;i++) amps[i] = Math.pow(amps[i], 0.6);
    let m = 0; for(const a of amps) if(a > m) m = a;
    if(m > 0) for(let i=0;i<amps.length;i++) amps[i] /= m;

    __waveAmps = amps;
  }catch(err){
    __waveAmps = null;
    waveMeta.textContent = "Waveform konnte nicht geladen werden (Codec/Browser).";
  }
}

function rafWave(){
  if(__waveAmps && audioBuffer && audioBuffer.duration){
    const p = getCurrentTime() / audioBuffer.duration;
    drawWaveWindow(__waveAmps, p);
  }else if(__waveAmps){
    drawWaveWindow(__waveAmps, 0);
  }
  updateNowPlaying();
  requestAnimationFrame(rafWave);
}
requestAnimationFrame(rafWave);

waveCanvas.addEventListener("pointerdown", async (e) => {
  if(!audioBuffer || !__waveAmps) return;
  await ensureAudio();
  const rect = waveCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const delta = (x - 0.5) * audioBuffer.duration;
  seekTo(clamp(getCurrentTime() + delta, 0, audioBuffer.duration));
});

window.addEventListener("resize", () => {
  if(__waveAmps && audioBuffer){
    drawWaveWindow(__waveAmps, audioBuffer.duration ? (getCurrentTime() / audioBuffer.duration) : 0);
  }
}, { passive:true });

window.addEventListener("keydown", (e) => {
  if(e.target && ["INPUT","TEXTAREA"].includes(e.target.tagName)) return;
  if(e.code === "Space"){
    e.preventDefault();
    btnPlay.click();
  }
  if(e.code === "ArrowLeft" && (e.ctrlKey || e.metaKey)) btnPrev.click();
  if(e.code === "ArrowRight" && (e.ctrlKey || e.metaKey)) btnNext.click();
});
</script>
