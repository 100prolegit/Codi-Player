<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MP3 Player – Hochwertiger Pitch + Effekte</title>
<style>
body { font-family: Arial; background:#111; color:white; padding:20px; }
label { display:block; margin-top:15px; }
input[type="range"] { width:300px; }
button { margin:5px; padding:8px 16px; }
#pitchShifterControls { display:flex; align-items:center; gap:10px; margin-top:10px; }
#pitchValue { font-size:18px; width:50px; text-align:center; }
</style>
</head>
<body>

<h2>MP3 Player – Hochwertiger Pitch, Flanger & Reverb ±12</h2>

<input type="file" id="fileInput" accept="audio/mp3">

<div>
  <button id="playBtn">Play</button>
  <button id="stopBtn">Stop</button>

  <label>
    Flanger (0–100%):
    <input type="range" id="flangerControl" min="0" max="1" step="0.01" value="0">
  </label>

  <label>
    Reverb (0–100%):
    <input type="range" id="reverbControl" min="0" max="1" step="0.01" value="0">
  </label>

  <label>Pitch-Shifter (Semitones):</label>
  <div id="pitchShifterControls">
    <button id="pitchDown">&lt;</button>
    <div id="pitchValue">0</div>
    <button id="pitchUp">&gt;</button>
  </div>
</div>

<script>
let audioContext = new (window.AudioContext || window.webkitAudioContext)();
let audioBuffer = null;
let bufferSource = null;
let pitchNode = null;
let semitones = 0;
const pitchValueDiv = document.getElementById("pitchValue");

// --- Effekte Setup ---
let dryGain = audioContext.createGain(); dryGain.gain.value = 1;

let flangerDelay = audioContext.createDelay(); flangerDelay.delayTime.value = 0.003;
let flangerFeedback = audioContext.createGain(); flangerFeedback.gain.value = 0.7;
flangerDelay.connect(flangerFeedback); flangerFeedback.connect(flangerDelay);
let flangerWet = audioContext.createGain(); flangerWet.gain.value = 0;

let lfo = audioContext.createOscillator(); let lfoGain = audioContext.createGain();
lfo.type = "sine"; lfo.frequency.value = 0.3; lfoGain.gain.value = 0.001;
lfo.connect(lfoGain); lfoGain.connect(flangerDelay.delayTime); lfo.start();

let convolver = audioContext.createConvolver();
let reverbWet = audioContext.createGain(); reverbWet.gain.value = 0;
function createImpulseResponse(duration=2.5, decay=3){
  let sampleRate = audioContext.sampleRate;
  let length = sampleRate*duration;
  let impulse = audioContext.createBuffer(2,length,sampleRate);
  for(let c=0;c<2;c++){
    let channel = impulse.getChannelData(c);
    for(let i=0;i<length;i++){
      channel[i] = (Math.random()*2-1) * Math.pow(1-i/length, decay);
    }
  }
  return impulse;
}
convolver.buffer = createImpulseResponse();

// --- AudioWorklet für hochwertigen Pitch-Shifter ---
async function initPitchWorklet() {
  const workletCode = `
  class GranularPitchProcessor extends AudioWorkletProcessor {
    static get parameterDescriptors() {
      return [{name: "semitones", defaultValue: 0, minValue: -12, maxValue: 12}];
    }
    constructor() {
      super();
      this.buffer = [];
      this.bufferSize = 2048;
    }
    process(inputs, outputs, parameters) {
      const input = inputs[0];
      const output = outputs[0];
      const semitones = parameters.semitones.length > 0 ? parameters.semitones[0] : 0;
      const pitchRatio = Math.pow(2, semitones/12);

      if(input[0]){
        for(let channel=0; channel<input.length; channel++){
          let inChannel = input[channel];
          let outChannel = output[channel];
          for(let i=0;i<inChannel.length;i++){
            let idx = i * pitchRatio;
            let prev = Math.floor(idx);
            let next = Math.min(prev+1, inChannel.length-1);
            let frac = idx-prev;
            outChannel[i] = inChannel[prev]*(1-frac) + inChannel[next]*frac;
          }
        }
      }
      return true;
    }
  }
  registerProcessor("granular-pitch-processor", GranularPitchProcessor);
  `;
  const blob = new Blob([workletCode], {type: "application/javascript"});
  await audioContext.audioWorklet.addModule(URL.createObjectURL(blob));
  pitchNode = new AudioWorkletNode(audioContext, "granular-pitch-processor");
  pitchNode.parameters.get("semitones").value = semitones;
}
initPitchWorklet();

// --- File Input ---
document.getElementById("fileInput").addEventListener("change", async function(e){
  let file = e.target.files[0];
  if(!file) return;
  let arrayBuffer = await file.arrayBuffer();
  audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
});

// --- Play ---
function playAudio() {
  if(!audioBuffer || !pitchNode) return;
  if(bufferSource) bufferSource.disconnect();

  bufferSource = audioContext.createBufferSource();
  bufferSource.buffer = audioBuffer;

  // Audio-Chain: Buffer → Pitch → Effekte → Output
  bufferSource.connect(pitchNode);
  pitchNode.connect(dryGain); dryGain.connect(audioContext.destination);
  pitchNode.connect(flangerDelay); flangerDelay.connect(flangerWet); flangerWet.connect(audioContext.destination);
  pitchNode.connect(convolver); convolver.connect(reverbWet); reverbWet.connect(audioContext.destination);

  bufferSource.start();
}

// --- Stop ---
document.getElementById("stopBtn").addEventListener("click", ()=>{
  if(bufferSource) bufferSource.stop();
});

// --- Pitch Buttons ---
document.getElementById("pitchUp").addEventListener("click", ()=>{
  if(semitones<12) semitones++;
  pitchValueDiv.textContent = semitones;
  if(pitchNode) pitchNode.parameters.get("semitones").value = semitones;
});
document.getElementById("pitchDown").addEventListener("click", ()=>{
  if(semitones>-12) semitones--;
  pitchValueDiv.textContent = semitones;
  if(pitchNode) pitchNode.parameters.get("semitones").value = semitones;
});

// --- Play Button ---
document.getElementById("playBtn").addEventListener("click", playAudio);

// --- Effekte Mix ---
function updateMix(){
  flangerWet.gain.value = parseFloat(document.getElementById("flangerControl").value);
  reverbWet.gain.value = parseFloat(document.getElementById("reverbControl").value);
  dryGain.gain.value = 1-Math.max(flangerWet.gain.value,reverbWet.gain.value);
}
document.getElementById("flangerControl").addEventListener("input",updateMix);
document.getElementById("reverbControl").addEventListener("input",updateMix);

</script>
</body>
</html>
